name: Hush Release Binaries

# Only this Hush-owned workflow needs to be enabled in the fork.
# Manual runs build/test artifacts without modifying a GitHub release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hush-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
            cc: gcc
            cxx: g++
          - platform: windows-x64
            os: windows-2022
            cc: cl
            cxx: cl
          - platform: macos-arm64
            os: macos-15
            cc: clang
            cxx: clang++
          - platform: macos-x64
            os: macos-15-intel
            cc: clang
            cxx: clang++
    defaults:
      run:
        shell: bash
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # MSVC's developer environment sets PLATFORM=x64; keep our asset label separate.
      HUSH_RELEASE_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Release builds must use the published tag, not the default branch.
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Install pinned build tools
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.3

      - name: Test release helpers
        run: python -m unittest discover -s .github/hush-release -p 'test_*.py' -v

      - name: Configure LLVM
        run: |
          platform_args=()
          case "$RUNNER_OS" in
            Linux)
              platform_args+=(-DLLVM_STATIC_LINK_CXX_STDLIB=ON -DCMAKE_EXE_LINKER_FLAGS=-static-libgcc)
              ;;
            Windows)
              platform_args+=(-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DLLVM_ENABLE_DIA_SDK=OFF)
              ;;
            macOS)
              platform_args+=(-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0)
              ;;
          esac
          cmake -S llvm -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            '-DLLVM_ENABLE_PROJECTS=clang;clang-tools-extra' \
            '-DLLVM_TARGETS_TO_BUILD=X86;AArch64' \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DCLANG_LINK_CLANG_DYLIB=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_CURL=OFF \
            -DLLVM_ENABLE_HTTPLIB=OFF \
            "${platform_args[@]}"

      - name: Build Hush tools and builtin headers
        run: cmake --build build --target hush-export hush-reflection clang-resource-headers --parallel 2

      - name: Package and test relocated tools
        env:
          RELEASE_REF: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          package_args=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            gcc_major=$(gcc -dumpversion | cut -d. -f1)
            package_args+=(--runtime-license "/usr/share/doc/gcc-${gcc_major}-base/copyright")
            for license in GPL-2 GPL-3 LGPL-2.1 LGPL-3; do
              package_args+=(--runtime-license "/usr/share/common-licenses/$license")
            done
          fi
          python .github/hush-release/package.py \
            --build-dir build --output-dir dist --platform "$HUSH_RELEASE_PLATFORM" \
            --ref "$RELEASE_REF" "${package_args[@]}"

      - name: Save validated release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hush-tools-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish complete release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download validated assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: hush-tools-*
          path: dist
          merge-multiple: true

      - name: Verify asset set and generate checksums
        shell: bash
        run: |
          cd dist
          expected=(
            hush-tools-linux-x64.tar.gz
            hush-tools-windows-x64.zip
            hush-tools-macos-arm64.tar.gz
            hush-tools-macos-x64.tar.gz
            hush-export.exe
            hush-reflection.exe
          )
          for asset in "${expected[@]}"; do
            test -s "$asset"
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}"
          sha256sum "${expected[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        # Do not silently overwrite binaries that consumers may have hash-pinned.
        run: gh release upload "$RELEASE_TAG" dist/*
